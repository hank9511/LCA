{% extends "base.html" %}

{% block title %}{{ t('login', 'page_title') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">{{ t('login', 'title') }}</h2>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">{{ t('login', 'username_label') }}</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">{{ t('login', 'password_label') }}</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">{{ t('login', 'btn_login') }}</button>
        </form>

        <div class="auth-links">
            <p>{{ t('login', 'no_account') }} <a href="{{ url_for('register') }}">{{ t('login', 'register_now') }}</a></p>
        </div>
    </div>
</div>
{% endblock %}
