{% extends "base.html" %}

{% block title %}{{ t('register', 'page_title') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">{{ t('register', 'title') }}</h2>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username">{{ t('register', 'username_label') }}</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="email">{{ t('register', 'email_label') }}</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">{{ t('register', 'password_label') }}</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">{{ t('register', 'btn_register') }}</button>
        </form>

        <div class="auth-links">
            <p>{{ t('register', 'have_account') }} <a href="{{ url_for('login') }}">{{ t('register', 'login_now') }}</a></p>
        </div>
    </div>
</div>
{% endblock %}
