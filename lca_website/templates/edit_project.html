{% extends "base.html" %}

{% block title %}{{ t('dashboard', 'edit') }} - {{ project.name }}{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">{{ t('dashboard', 'edit') }} {{ t('dashboard', 'project_name') }}</h2>
        <form method="POST" class="project-form">
            <div class="form-group">
                <label for="name">{{ t('new_project', 'project_name_label') }} *</label>
                <input type="text" id="name" name="name" value="{{ project.name }}" required>
            </div>

            <div class="form-group">
                <label for="description">{{ t('new_project', 'description_label') }}</label>
                <textarea id="description" name="description" rows="4">{{ project.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="status">{{ t('dashboard', 'status') }}</label>
                <select id="status" name="status">
                    <option value="active" {% if project.status == 'active' %}selected{% endif %}>{{ t('dashboard', 'status_active') }}</option>
                    <option value="completed" {% if project.status == 'completed' %}selected{% endif %}>{{ t('dashboard', 'status_completed') }}</option>
                    <option value="archived" {% if project.status == 'archived' %}selected{% endif %}>{{ t('dashboard', 'status_archived') }}</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('project_detail', project_id=project.id) }}" class="btn btn-secondary">{{ t('common', 'cancel') }}</a>
                <button type="submit" class="btn btn-primary">{{ t('common', 'save') }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
