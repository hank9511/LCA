{% extends "base.html" %}

{% block title %}{{ t('new_project', 'page_title') }}{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <h2 class="form-title">{{ t('new_project', 'title') }}</h2>
        <form method="POST" class="project-form">
            <div class="form-group">
                <label for="name">{{ t('new_project', 'project_name_label') }} *</label>
                <input type="text" id="name" name="name" placeholder="{{ t('new_project', 'project_name_placeholder') }}" required>
            </div>

            <div class="form-group">
                <label for="description">{{ t('new_project', 'description_label') }}</label>
                <textarea id="description" name="description" rows="4" placeholder="{{ t('new_project', 'description_placeholder') }}"></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">{{ t('new_project', 'btn_cancel') }}</a>
                <button type="submit" class="btn btn-primary">{{ t('new_project', 'btn_create') }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
